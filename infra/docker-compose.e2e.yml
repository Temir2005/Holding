# End-to-end tests in an isolated copy of the stack (`make e2e`).
#
# Used only together with docker-compose.yml under its own project name
# (`-p megasmart-e2e`), so containers, network and volumes (database, bucket,
# node_modules) are separate from the dev stack and are removed after the run.
# It never touches the dev database.
#
# - Env comes from .env.example: throwaway dev values, independent of your .env.
# - No ports are published, so it runs next to a running dev stack.
# - The browser runs in the `e2e` container inside the network namespace of `frontend`, so
#   it opens the app as http://localhost:5173: a secure context like the real https site
#   (navigator.locks works). The bucket is http://minio:9000 over the compose network.

services:
  postgres:
    ports: !reset []

  minio:
    ports: !reset []

  backend:
    env_file: !override ../.env.example
    environment:
      # Images and presigned upload links must point where the e2e browser can reach.
      S3_PUBLIC_URL: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://minio:9000
    ports: !reset []

  frontend:
    env_file: !override ../.env.example
    ports: !reset []

  e2e:
    # Keep in sync with @playwright/test in frontend/package.json.
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    working_dir: /app
    network_mode: "service:frontend"
    environment:
      E2E_BASE_URL: http://localhost:5173
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-e2e-admin@example.com}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-e2e-password-not-secret}
      CI: "1"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - frontend
    profiles: ["e2e"]
