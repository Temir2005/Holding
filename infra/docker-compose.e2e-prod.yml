# Smoke tests of the production build (`make e2e-prod`).
#
# Used on top of docker-compose.yml and docker-compose.e2e.yml under its own project name
# (`-p megasmart-e2e-prod`): the same isolated database and bucket as `make e2e`, removed after
# the run. Instead of the Vite dev server (StrictMode, unbundled modules) the site is the image
# that ships: `frontend/Dockerfile.prod`, the static build served by Caddy, which proxies /api.
#
# - The browser runs in the network namespace of `web` and opens http://localhost:8080.
# - `frontend` is not started; `make e2e-prod` only creates it once (`run --rm ... true`) so the
#   node_modules volume the test runner mounts gets filled from the dev image.

services:
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    environment:
      PORT: "8080"
      API_UPSTREAM: http://backend:8000
    depends_on:
      - backend

  e2e-prod:
    # Keep in sync with @playwright/test in frontend/package.json.
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    working_dir: /app
    network_mode: "service:web"
    environment:
      E2E_BASE_URL: http://localhost:8080
      CI: "1"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web
    profiles: ["e2e"]
